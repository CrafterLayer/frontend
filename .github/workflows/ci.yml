name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned pnpm and Node
        uses: pnpm/setup@v2.0.1
        with:
          version: 11.23.0
          runtime: node@24.19.0
          install: false
          cache:
            ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
            == github.repository }}

      - name: Confirm toolchain identity
        run: |
          node --version
          pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run workspace quality contract
        run: pnpm verify
