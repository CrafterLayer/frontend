schema_version: "1.0"

preset:
  id: react-monorepo-quality
  name: "React Monorepo Quality"
  version: "1.0.2"
  description: "Wraps Spec Kit planning, tasks, and implementation with mandatory monorepo and UI quality gates"
  author: craftkit-builder
  license: MIT

requires:
  speckit_version: ">=1.0.0"

provides:
  templates:
    - type: command
      name: speckit.plan
      file: commands/speckit.plan.md
      description: "Require explicit monorepo architecture and UI artifact planning"
      strategy: wrap
    - type: command
      name: speckit.tasks
      file: commands/speckit.tasks.md
      description: "Make tests, Storybook, docs, review, and verification first-class tasks"
      strategy: wrap
    - type: command
      name: speckit.implement
      file: commands/speckit.implement.md
      description: "Enforce complete components and package-scoped verification during implementation"
      strategy: wrap

tags:
  - react
  - monorepo
  - storybook
  - testing
  - governance
