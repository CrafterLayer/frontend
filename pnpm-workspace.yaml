packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/builder/*'
  - 'packages/builder/extensions/*'

# promptfoo ships a MongoDB result store and nunjucks templating we never
# load; each pins an older peer than this workspace resolves. Scoped to those
# two edges so a real peer conflict in our own code still fails the install.
peerDependencyRules:
  allowedVersions:
    'mongodb>gcp-metadata': '9'
    'nunjucks>chokidar': '5'

