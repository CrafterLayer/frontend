sharedWorkspaceLockfile: true
saveWorkspaceProtocol: rolling
catalogMode: prefer
disallowWorkspaceCycles: true
failIfNoMatch: true
engineStrict: true
strictPeerDependencies: true
strictDepBuilds: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
# User-authorized exact exception (session 2026-08-25, delegated decision per HANDOFF
# "Next Exact Action"): transitive semver@6.3.1 from the existing Babel toolchain is
# older than the semver majors already trusted elsewhere in the graph, tripping
# no-downgrade. Scope is this one exact version; do not broaden.
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true

# pixi-assetpack (2026-10-12): AssetPack asks for chokidar ^4.0.3, and 4.0.2/4.0.3 were published
# without the provenance 3.6.0-4.0.1 carry, so no-downgrade refuses them. Its watcher (watch mode
# only) gets the last attested 4.x instead of an exception to the trust policy.
overrides:
  '@assetpack/core>chokidar': 4.0.1

# Install scripts this workspace declines to run. promptfoo (apps/evals)
# pulls optional native packages for local embeddings and image work no eval
# here calls, plus a protobuf codegen step. Chromium is declined because the
# browser Storybook's tests drive is installed separately, which is how this
# repo already worked before pnpm asked the question.
allowBuilds:
  '@playwright/browser-chromium': false
  '@swc/core': false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  esbuild: true
  # pixi-assetpack (2026-10-12): the ffmpeg binary package's only script is `chmod u+x ffmpeg`, so
  # AssetPack's audio pipe can run it (a build-time tool; the GPLv3 binary never ships). Every
  # platform is listed so an install on macOS or Windows meets the same decision. cpu-features is
  # an optional node-gyp build the GPU texture encoder does without.
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/darwin-x64': true
  '@ffmpeg-installer/linux-arm': true
  '@ffmpeg-installer/linux-arm64': true
  '@ffmpeg-installer/linux-ia32': true
  '@ffmpeg-installer/linux-x64': true
  '@ffmpeg-installer/win32-ia32': true
  '@ffmpeg-installer/win32-x64': true
  cpu-features: false
